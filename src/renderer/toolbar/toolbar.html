<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data:; font-src 'self'; form-action 'none'; base-uri 'none'; frame-ancestors 'none';"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>MiniBrowser Controls</title>
    <link rel="stylesheet" href="toolbar.css" />
  </head>
  <body>
    <div class="bar" id="bar">
      <!-- ROW 1 — menubar. Every menu in the app lives here. -->
      <div class="menubar" id="menubar">
        <div class="brand" title="MiniBrowser">
          <svg viewBox="0 0 24 24"><path d="M12 3l7 3v6c0 4.2-2.9 7.6-7 9-4.1-1.4-7-4.8-7-9V6z" /></svg>
        </div>

        <button class="menu-title" data-menu="file">File</button>
        <button class="menu-title" data-menu="edit">Edit</button>
        <button class="menu-title" data-menu="view">View</button>
        <button class="menu-title" data-menu="history">History</button>
        <button class="menu-title" data-menu="privacy">Privacy</button>
        <button class="menu-title" data-menu="window">Window</button>

        <!-- draggable gap: moves the control bar itself -->
        <div class="drag-gap" id="dragGap" title="Drag to move the control bar"></div>

        <div class="win-buttons">
          <button class="wb" id="minimize" title="Minimize page window" aria-label="Minimize">
            <svg viewBox="0 0 24 24"><path d="M5 12h14" /></svg>
          </button>
          <button class="wb" id="maximize" title="Maximize page window" aria-label="Maximize">
            <svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" /></svg>
          </button>
          <button class="wb danger" id="close" title="Quit MiniBrowser" aria-label="Close">
            <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" /></svg>
          </button>
        </div>
      </div>

      <!-- ROW 2 — navigation + omnibox -->
      <div class="row primary">
        <div class="cluster nav">
          <button class="icon" id="back" title="Back (Alt+←)" aria-label="Back">
            <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" /></svg>
          </button>
          <button class="icon" id="forward" title="Forward (Alt+→)" aria-label="Forward">
            <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" /></svg>
          </button>
          <button class="icon" id="reload" title="Reload (Ctrl/Cmd+R)" aria-label="Reload">
            <svg viewBox="0 0 24 24" class="ico-reload">
              <path d="M20 11a8 8 0 10-2.3 5.7" />
              <path d="M20 5v6h-6" />
            </svg>
            <svg viewBox="0 0 24 24" class="ico-stop"><path d="M6 6l12 12M18 6L6 18" /></svg>
          </button>
          <button class="icon" id="home" title="Home" aria-label="Home">
            <svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v8a1 1 0 01-1 1h-4v-6h-6v6H5a1 1 0 01-1-1z" /></svg>
          </button>
        </div>

        <form class="omnibox" id="omniform" autocomplete="off">
          <span class="lock" id="lock" title="Connection status">
            <svg viewBox="0 0 24 24" class="ico-secure">
              <rect x="5" y="10" width="14" height="10" rx="2" />
              <path d="M8 10V7a4 4 0 018 0v3" />
            </svg>
            <svg viewBox="0 0 24 24" class="ico-insecure">
              <path d="M12 4v9m0 4v.5" />
              <path d="M10.3 3.9L2.6 18a1.6 1.6 0 001.4 2.4h16a1.6 1.6 0 001.4-2.4L13.7 3.9a1.6 1.6 0 00-2.8 0z" />
            </svg>
          </span>
          <input
            id="url"
            type="text"
            spellcheck="false"
            autocapitalize="off"
            autocorrect="off"
            placeholder="Search DuckDuckGo or enter an address"
            aria-label="Address and search bar"
          />
          <button type="button" class="chip shield" id="shield" title="Trackers blocked on this page">
            <svg viewBox="0 0 24 24"><path d="M12 3l7 3v6c0 4.2-2.9 7.6-7 9-4.1-1.4-7-4.8-7-9V6z" /></svg>
            <span id="shieldCount">0</span>
          </button>
        </form>

        <!-- move handle for the frameless PAGE window -->
        <button class="icon move-handle" id="moveWindow" title="Drag to move the page window">
          <svg viewBox="0 0 24 24">
            <path d="M12 3v18M3 12h18M12 3l-2.5 2.5M12 3l2.5 2.5M12 21l-2.5-2.5M12 21l2.5-2.5M3 12l2.5-2.5M3 12l2.5 2.5M21 12l-2.5-2.5M21 12l-2.5 2.5" />
          </svg>
        </button>
      </div>

      <div class="progress" id="progress"><span></span></div>

      <!-- find bar -->
      <div class="findbar" id="findbar" hidden>
        <svg viewBox="0 0 24 24" class="find-ico"><circle cx="11" cy="11" r="6" /><path d="M20 20l-4.3-4.3" /></svg>
        <input id="findInput" type="text" placeholder="Find in page" aria-label="Find in page" spellcheck="false" />
        <span class="find-count" id="findCount">0/0</span>
        <button class="icon small" id="findPrev" title="Previous"><svg viewBox="0 0 24 24"><path d="M18 15l-6-6-6 6" /></svg></button>
        <button class="icon small" id="findNext" title="Next"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" /></svg></button>
        <button class="icon small" id="findClose" title="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" /></svg></button>
      </div>

      <!-- dropdown menus -->
      <div class="dropdown" id="dropdown" hidden></div>

      <div class="toast" id="toast" hidden></div>
    </div>

    <script src="toolbar.js"></script>
  </body>
</html>
